<style>
:root{
  --ink:#0E2A2B; --ink2:#17403F; --paper:#EFF1EC; --card:#FFFFFF; --line:#D8DDD6;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.02em}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
header{background:var(--ink);color:#EFF1EC;padding:22px 0 0}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand h1{font-size:36px;font-weight:800;color:#fff}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--senape)}
.fase{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#9FB3B0;text-align:right}
.fase b{color:#fff;display:block;font-size:13px}
nav{display:flex;gap:2px;margin-top:18px;overflow-x:auto}
nav button{background:transparent;border:0;color:#9FB3B0;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:11px 14px;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:var(--ink);background:var(--paper);border-bottom-color:var(--senape)}
main{padding:24px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.card h2{font-size:19px;font-weight:600;margin-bottom:3px}
.card h3{font-size:15px;font-weight:600;margin-bottom:6px}
.sub{color:var(--grigio);font-size:13px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--grigio);margin-bottom:5px;font-family:'IBM Plex Mono',monospace}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--senape);outline-offset:-1px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:var(--r);padding:9px 15px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.btn:hover{background:var(--ink2)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#F4F6F2}
.btn.small{padding:5px 10px;font-size:11px}
.btn.on{background:var(--oliva)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;cursor:pointer;background:#fff;font-family:'IBM Plex Mono',monospace}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.hr{height:1px;background:var(--line);margin:16px 0}
.kpi{border-left:3px solid var(--senape);padding-left:12px}
.kpi .v{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;line-height:1.15}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--grigio);font-family:'IBM Plex Mono',monospace}
.kpi .v small{font-size:12px;font-weight:400;color:var(--grigio)}

.ledger{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:210px;margin-top:6px}
.ldcol{display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer}
.ldbar{display:flex;flex-direction:column;border:1px solid var(--ink);border-bottom:0}
.seg-f{background:var(--oliva)}.seg-c{background:var(--senape)}.seg-p{background:var(--mattone)}
.ldcol.sel .ldbar{outline:2px solid var(--ink);outline-offset:2px}
.ldcol.oggi .ldday{background:var(--ink);color:#fff}
.ldfoot{border-top:2px solid var(--ink);padding-top:5px;text-align:center}
.ldday{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.ldkcal{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.ldact{font-size:10px;color:var(--grigio);height:24px;overflow:hidden;line-height:1.2}
.legend{display:flex;gap:14px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--grigio);margin-top:10px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:middle}
.meal{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.mealhead{display:flex;align-items:center;gap:9px;background:#F4F6F2;padding:9px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mealhead .t{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;background:var(--senape);color:var(--ink);padding:2px 7px;border-radius:999px}
.tag.b{background:var(--ink);color:#fff}
.mealhead .m{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--grigio)}
.mealbody{padding:11px 13px}
.porz{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.pz{border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#FBFCFA}
.pz b{font-size:14px}
.opt{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}

.scelto{background:#FBF3E2;margin:0 -13px;padding:6px 13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--grigio);border-bottom:1px solid var(--line);padding:7px 6px}

td.n,th.n{font-family:'IBM Plex Mono',monospace;text-align:right}
.pos{color:var(--oliva)}.neg{color:var(--mattone)}
.note{font-size:12.5px;color:var(--grigio);line-height:1.55}
.warn{background:#FBF3E2;border:1px solid #E6D4A8;border-radius:var(--r);padding:11px 13px;font-size:13px}
.alert{background:#F9EAE7;border:1px solid #E3BDB5;border-radius:var(--r);padding:11px 13px;font-size:13px}
.ok{background:#EDF3EA;border:1px solid #C3D6BB;border-radius:var(--r);padding:11px 13px;font-size:13px}
.ex{border-bottom:1px solid var(--line);padding:11px 0}
.ex:last-child{border-bottom:0}
.ex .nm{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ex .sr{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--grigio)}
.ex .de{font-size:13px;color:var(--grigio);margin-top:4px;line-height:1.55}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--grigio);text-align:center;padding-bottom:4px}
.calc{border:1px solid var(--line);border-radius:3px;min-height:82px;padding:4px 5px;cursor:pointer;background:#fff}
.calc:hover{background:#F7F9F5}
.calc.sel{outline:2px solid var(--ink);outline-offset:-1px}
.calc.oggi .caln{background:var(--ink);color:#fff;border-radius:2px;padding:0 4px;display:inline-block}
.caln{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--grigio);margin-bottom:3px}
.cala{font-size:10px;line-height:1.25;border-left:3px solid var(--line);padding:1px 0 1px 4px;margin-bottom:2px;background:#F7F9F5}
.calm{font-family:'IBM Plex Mono',monospace;color:var(--grigio);margin-left:3px}
.calk{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--grigio);text-align:right}
@media(max-width:820px){.calc{min-height:58px}.cala{font-size:8px}.calk{display:none}}
.bar{height:110px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line)}
.bar i{flex:1;background:var(--ink);opacity:.8;display:block}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:10.5pt}
  header,nav,.noprint{display:none!important}
  main{padding:0}
  .wrap{max-width:none;padding:0}
  .card{border:none;padding:0;margin:0 0 14px}
  .card+.card{margin-top:0}
  table{font-size:9.5pt}
  th,td{padding:4px 5px}
  .kpi{border-left-width:2px}
  .kpi .v{font-size:16pt}
  .rep-h{display:block!important}
  .grid{break-inside:avoid}
  .card,tr{break-inside:avoid}
}
.rep-h{display:none}
@media(max-width:820px){
  .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
  .brand h1{font-size:28px}.fase{display:none}
  .ledger{height:160px;gap:3px}.ldday{font-size:9px}.ldkcal{font-size:10px}.ldact{display:none}
}
</style>

  const m=d.getMonth(), g=d.getDate();

/* ============ FAMIGLIE PROTEICHE ============ */
// servono per far ruotare le proposte: se in settimana hai già mangiato pollo tre volte,
// il piatto ti propone prima qualcos'altro. Vale sia per i nomi delle liste di scambio
// che per quelli del database dei pasti, così il conteggio e la proposta parlano la stessa lingua.
const FAM_PROT=[
  [/pollo|tacchino/i,'pollo'],
  [/manzo|vitell|hamburger|tartare|roast ?beef/i,'carne rossa'],
  [/lonza|maiale|speck|prosciutto|salumi|bresaola/i,'maiale e salumi'],
  [/salmone|tonno|pesce/i,'pesce'],
  [/uov/i,'uova'],
  [/grana|parmigian|formaggio|mozzarella|emmental|fontina|ricotta|fiocchi di latte|yogurt|latte/i,'latticini'],
  [/legumi|ceci|fagioli|lenticchie/i,'legumi'],
];
const famDi=n=>{for(const [re,f] of FAM_PROT) if(re.test(n)) return f; return null;};

// stessa idea per i carboidrati: altrimenti il piatto propone pane tutti i giorni,
// perché è il primo della lista, e la pasta non la vedi mai.
const FAM_CARB=[
  [/pasta|riso|orzo|farro|cous ?cous/i,'pasta e riso'],
  [/pane|frisa|piadina|baguette|panino/i,'pane'],
  [/patat|pur[eè]/i,'patate'],
  [/gallette|crackers|grissini|fette biscottate/i,'crackers e gallette'],
  [/legumi|ceci|fagioli|lenticchie/i,'legumi'],
  [/avena|cereali|muesli|biscotti|gocciole/i,'cereali da colazione'],
];
const famCarbDi=n=>{for(const [re,f] of FAM_CARB) if(re.test(n)) return f; return null;};
const famRuolo=(n,r)=>r==='c'?famCarbDi(n):famDi(n);

// quante volte ogni famiglia è comparsa nei sette giorni che finiscono a `data`.
// conta solo le voci che portano almeno 10 g di proteine: il grana sull'insalata non è una fonte.
function usiProteine(st,data){
  const u={}, d0=new Date(data+'T12:00:00');
  if(isNaN(d0)) return u;
  for(let i=0;i<7;i++){
    const d=new Date(d0); d.setDate(d.getDate()-i);
    const pasti=(st.registro[iso(d)]||{}).pasti||{};
    Object.keys(pasti).forEach(id=>{
      const voci=(pasti[id]||{}).voci;
      if(!Array.isArray(voci)) return;
      voci.forEach(x=>{
        const o=ALIMENTI.find(z=>z.n===x.n); if(!o) return;
        const m=x.m||1;
        if(o.p*m>=10){ const f=famDi(x.n); if(f) u[f]=(u[f]||0)+1; }
        if(o.c*m>=15){ const f=famCarbDi(x.n); if(f) u[f]=(u[f]||0)+1; }
      });
    });
  }
  return u;
}
// le opzioni di una lista per un dato ruolo, dalla meno usata alla più usata.
// a parità di usi resta l'ordine originale, che è quello che ha più senso per quel pasto.
function ordinaPer(lista,r,usi){
  return lista.filter(x=>x.r===r)
    .map((o,i)=>({o,i,u:usi[famRuolo(o.n,r)]||0}))
    .sort((a,b)=>a.u-b.u||a.i-b.i)
    .map(x=>x.o);
}
// quantità di n porzioni di un alimento, scritta in modo leggibile
function quanti(o,n){
  if(n<=0) return null;
  const v=o.q*n, num = Number.isInteger(v)?v:(v<10?Math.round(v*2)/2:Math.round(v/5)*5);
  const u = (num===1||!o.u2) ? o.u : o.u2;
  return o.solo ? String(num).replace('.',',')+' '+u : String(num).replace('.',',')+' '+u+' di '+o.n;
}

/* ===================== CALCOLI ===================== */
const bmr=p=>Math.round(10*p.peso+6.25*p.altezza-5*p.eta+(p.sesso==='m'?5:-161));
// costo netto: (MET-1) toglie il metabolismo che spenderesti comunque stando fermo
const kcalAtt=(a,peso)=>Math.round(Math.max(0,(ATT[a.t]?ATT[a.t].met:0)-1)*3.5*peso/200*(a.min||0));

function attivitaDi(st,data){
  if(st.override[data]) return st.override[data];
  const d=new Date(data+'T12:00:00'), idx=(d.getDay()+6)%7, f=faseDi(d);
  const base = f==='off' ? SETT_OFF : f==='prep' ? SETT_PREP : f==='camp' ? SETT_CAMP
             : SETT_PREP.map((x,i)=>i===2?[]:x);
  return JSON.parse(JSON.stringify(base[idx]));
}
function giornoCalc(st,data){
  const p=st.profilo, base=bmr(p), att=attivitaDi(st,data);
  const reg=st.registro[data]||{};
  const eff=att.map((a,i)=>({...a, idx:i,
    fatto: reg.fatti && reg.fatti[i]!==undefined ? reg.fatti[i] : true,
    confermato: !!(reg.fatti && reg.fatti[i]===true),
    min: reg.minuti && reg.minuti[i]!==undefined ? reg.minuti[i] : a.min,
    inten: (reg.intens && reg.intens[i]) || 'normale'}));
  const svolte=eff.filter(a=>a.fatto);
  const extra=svolte.reduce((s,a)=>s+Math.round(kcalAtt(a,p.peso)*INTENS[a.inten].k),0);
  const tdee=Math.round(base*p.lavoro+extra);
  const campo=svolte.some(a=>a.t.startsWith('futsal'));
  const tipo = !svolte.length ? 'riposo' : campo ? 'campo' : 'palestra';
  let target=Math.round(tdee*(1+DEF[tipo]));
  const floor=Math.max(base, 1600);
  const sottoFloor=target<floor; if(sottoFloor) target=floor;
  const prot=Math.round(p.peso*p.protKg);
  const gras=Math.round(Math.max(p.peso*p.grassiKg, target*0.25/9));
  const carb=Math.max(80,Math.round((target-prot*4-gras*9)/4));
  target=prot*4+carb*4+gras*9;
  return {data,att:eff,extra,tdee,tipo,target,prot,carb,gras,sottoFloor,campo,
    quando:(svolte[0]||{}).q||null,
    etichetta:svolte.map(a=>ATT[a.t].n).join(' + '),
    previste:att.map(a=>ATT[a.t].n).join(' + ')};
}
function settimanaCalc(st,lun){
  return [...Array(7)].map((_,i)=>{const d=new Date(lun);d.setDate(d.getDate()+i);return giornoCalc(st,iso(d));});
}
// consumato registrato nel giorno
function consumato(st,data){
  const r=(st.registro[data]||{}).pasti||{};
  let k=0,p=0,c=0,f=0;
  Object.values(r).forEach(v=>{if(!v)return;k+=v.k||0;p+=v.p||0;c+=v.c||0;f+=v.f||0;});
  return {k,p,c,f};
}
// scostamento della settimana in corso, spalmato sui giorni che restano
function compensazione(st,giorni,oggi){
  let scost=0, passati=0;
  giorni.forEach(g=>{
    if(g.data<oggi){
      const c=consumato(st,g.data);
      if(c.k>0){scost+=c.k-g.target;passati++;}
    }
  });
  const restanti=giorni.filter(g=>g.data>=oggi).length;
  if(!restanti||!passati) return {scost:0,perGiorno:0,residuo:0,passati};
  let per=-Math.round(scost/restanti);
  const cap=150;
  const capped=Math.max(-cap,Math.min(cap,per));
  return {scost,perGiorno:capped,residuo:scost+capped*restanti,passati,troncato:capped!==per};
}
// porzioni indicative dai macro del giorno
function porzioni(g){
  const frutti = g.tipo==='riposo'?2:3;
  const carbCer = Math.max(0,g.carb - frutti*PORZ.frutto);
  const grassiAgg = g.gras*0.45; // il resto è già dentro carne, formaggi e biscotti
  return {palmi:Math.round(g.prot/PORZ.palmo), pugni:Math.round(carbCer/PORZ.pugno),
          pollici:Math.max(1,Math.round(grassiAgg/PORZ.pollice)), frutti};
}
// distribuisce un totale intero sui pasti secondo le quote, senza perdere né inventare porzioni
function riparti(tot,quote,minimi){
  const grezzi=quote.map(q=>q*tot);
  let out=grezzi.map((v,i)=>Math.max(minimi?minimi[i]:0,Math.floor(v)));
  let resto=tot-out.reduce((a,b)=>a+b,0);
  const ordine=grezzi.map((v,i)=>({i,f:v-Math.floor(v)})).sort((a,b)=>b.f-a.f);
  let k=0;
  while(resto>0){out[ordine[k%ordine.length].i]++;resto--;k++;}
  while(resto<0){
    const cand=ordine.slice().reverse().find(o=>out[o.i]>(minimi?minimi[o.i]:0));
    if(!cand)break; out[cand.i]--; resto++;
  }
  return out;
}
/* piano pasti in porzioni */
function pastiDi(g){
  const P=porzioni(g), campo=g.campo, sera=g.quando==='sera', preGara=campo&&sera;
  const palmi  =riparti(P.palmi,  [.17,0,.33,0,.50],[1,0,1,0,1]);
  const pugni  =riparti(P.pugni,  [.20,.12,.30,preGara?.22:.15,preGara?.16:.23],[0,0,0,0,0]);
  const pollici=riparti(P.pollici,[0,.30,.35,preGara?0:.10,preGara?.35:.25],[0,0,0,0,0]);
  const frutti =riparti(P.frutti, [.34,.33,0,.33,0],[0,0,0,0,0]);
  const base=[
    {id:'colazione',n:'Colazione',ruoli:['p','c','g'],
      liste:[['Carboidrati','colaz_carb'],['Da aggiungere per le proteine','colaz_prot']],
      nota:'Latte o tè come sempre. L\'unica aggiunta rispetto alla tua colazione abituale è la parte proteica: senza, parti con venticinque grammi di debito che a sera non recuperi.'},
    {id:'sp1',n:'Spuntino mattina',ruoli:['c','g'],
      liste:[['Scegli una o due voci','spuntino']],
      nota:'Nessuna proteina obbligatoria qui: crackers, mandorle, frutta.'},
    {id:'pranzo',n:'Pranzo fuori',ruoli:['p','c','g','v'],
      liste:[['Proteine — la parte che non puoi saltare','prot_pranzo'],['Carboidrati','carb_pranzo'],['Verdura','verdura']],
      nota:'Al bar la regola è una sola: che ci sia sempre la parte proteica. I carboidrati li sposti dove vuoi, le proteine no.'},
    {id:'sp2',n:preGara?'Merenda — pre partita':'Merenda',pre:preGara,ruoli:['c','g'],
      liste:[[preGara?'Carboidrati facili da digerire':'Scegli una o due voci',preGara?'pre_gara':'spuntino']],
      nota:preGara?'Due ore prima di scendere in campo: carboidrati semplici e niente grassi, che rallentano la digestione.':null},
    {id:'cena',n:preGara?'Cena — dopo il campo':'Cena',post:preGara,ruoli:['p','c','g','v'],
      liste:[['Proteine','prot_cena'],['Carboidrati','carb_cena'],['Verdura','verdura'],['Grassi da aggiungere','grassi']],
      nota:'La cena è il pasto di compensazione: se a pranzo è andata storta, qui aggiusti. Se hai già preso molti carboidrati, togli i pugni e lascia proteine e verdura.'},
  ];
  return base.map((m,i)=>({...m,palmi:palmi[i],pugni:pugni[i],pollici:pollici[i],frutti:frutti[i]}));
}
/* stato della giornata: cosa è già stato registrato e come si ridistribuisce quello che resta */
function statoGiornata(st,g,perGiorno){
  const reg=st.registro[g.data]||{}, cons=consumato(st,g.data);
  const targetAdj=Math.max(bmr(st.profilo), g.target+(perGiorno||0));
  const res={k:targetAdj-cons.k,p:g.prot-cons.p,c:g.carb-cons.c,f:g.gras-cons.f};
  const pasti=pastiDi(g);
  const stato=m=>{const v=(reg.pasti||{})[m.id]; if(!v)return 'aperto'; return v.saltato?'saltato':'fatto';};
  const aperti=pasti.filter(m=>stato(m)==='aperto');
  // ogni macro si divide solo tra i pasti che possono ospitarla: le proteine non finiscono sugli spuntini
  const peso=(r)=>aperti.filter(m=>m.ruoli.includes(r)).reduce((s2,m)=>s2+pesoPasto(m),0)||1;
  const pesoP=peso('p'), pesoC=peso('c'), pesoG=peso('g');
  // arrotondo a mezza porzione, non all'intero: con 25 g di carboidrati residui
  // il piatto deve dire mezzo pugno, non un pugno pieno che ne vale 30
  const mezzi=x=>Math.max(0,Math.round(x*2)/2);
  const adattato=m=>{
    if(stato(m)!=='aperto') return {palmi:0,pugni:0,pollici:0};
    const w=pesoPasto(m);
    const grezzo=m.ruoli.includes('p')?mezzi(res.p*w/pesoP/PORZ.palmo):0;
    return {palmi:Math.min(4,grezzo), palmiTeorici:grezzo,
            pugni:  m.ruoli.includes('c')?Math.min(7,mezzi(res.c*w/pesoC/PORZ.pugno)):0,
            pollici:m.ruoli.includes('g')?mezzi(res.f*w/pesoG*0.45/PORZ.pollice):0};
  };
  const iniziata=cons.k>0||pasti.some(m=>stato(m)!=='aperto');
  return {reg,cons,targetAdj,res,pasti,stato,adattato,iniziata};
}

/* pannello di registrazione di un esercizio: aggiunge, modifica e cancella le voci di carico.
   Una voce è {d, set, kg, reps}: set è il numero di serie fatte con quel peso.
   Le voci vecchie non hanno set — valgono 1, così lo storico di prima resta leggibile. */
function PannelloEx({id,st,up,oggi,form,setForm}){
  const log=[...(st.carichi[id]||[])].sort((a,b)=>a.d.localeCompare(b.d));
  const ult=log[log.length-1];
  const scrivi=arr=>{const c={...st.carichi}; if(arr.length) c[id]=arr; else delete c[id]; up({carichi:c});};
  const leggi=()=>{
    const reps=parseInt(form.reps,10);
    const set=parseInt(form.set,10);
    if(isNaN(reps)||reps<=0) return null;
    // il peso è facoltativo: plank, crunch e leg raise si fanno a corpo libero
    const kg=form.kg===''||form.kg==null?0:parseFloat(String(form.kg).replace(',','.'));
    if(isNaN(kg)) return null;
    return {d:form.d||oggi, set:(isNaN(set)||set<=0)?1:set, kg, reps};
  };
  const conferma=()=>{
    const v=leggi(); if(!v) return;
    const cur=st.carichi[id]||[];
    if(form.mod!=null&&cur[form.mod]) scrivi(cur.map((x,j)=>j===form.mod?v:x));
    else scrivi([...cur,v]);
    // dopo l'inserimento tengo peso e serie: di solito la voce dopo è simile
    setForm({d:v.d, set:String(v.set), kg:String(v.kg), reps:'', mod:null});
  };
  const modifica=x=>{
    const j=(st.carichi[id]||[]).indexOf(x);
    setForm({d:x.d, set:String(x.set||1), kg:String(x.kg), reps:String(x.reps), mod:j});
  };
  const inMod=form.mod!=null;
  return<div style={{marginTop:10,padding:11,background:'var(--paper)',borderRadius:'var(--r)'}}>
    <div className="row" style={{gap:6,flexWrap:'wrap'}}>
      <input type="date" value={form.d||''} onChange={e=>setForm({...form,d:e.target.value})} style={{maxWidth:150}}/>
      <input type="number" placeholder="serie" value={form.set||''}
        onChange={e=>setForm({...form,set:e.target.value})} style={{maxWidth:76}}/>
      <input type="number" placeholder="rip." value={form.reps||''}
        onChange={e=>setForm({...form,reps:e.target.value})}
        onKeyDown={e=>{if(e.key==='Enter')conferma();}} style={{maxWidth:76}}/>
      <input type="number" step="0.5" placeholder={ult&&ult.kg?'kg (ult. '+ult.kg+')':'kg — vuoto se a corpo libero'} value={form.kg||''}
        onChange={e=>setForm({...form,kg:e.target.value})} style={{maxWidth:96}}/>
      <button className="btn small" onClick={conferma}>{inMod?'Salva':'Aggiungi'}</button>
      {inMod&&<button className="btn ghost small" onClick={()=>setForm({d:oggi,set:'',kg:'',reps:'',mod:null})}>Annulla</button>}
    </div>
    <div className="note" style={{marginTop:6}}>
      {inMod?'Stai modificando una riga esistente.'
            :'Serie e ripetizioni di quel peso: per 3×10 metti 3 e 10. Se le serie sono andate diverse fra loro, mettine una riga per ciascuna.'}
    </div>
    <div style={{marginTop:9}}>
      <textarea placeholder="Note: che attrezzo hai usato, il buco del sedile, fastidi…" rows={2}
        value={(st.noteEx||{})[id]||''} style={{width:'100%',resize:'vertical'}}
        onChange={e=>{const n={...(st.noteEx||{})};
          if(e.target.value.trim()) n[id]=e.target.value; else delete n[id];
          up({noteEx:n});}}/>
      <div className="sr">La nota resta sull'esercizio, non sulla singola riga.</div>
    </div>
    {log.length>0
      ? <div style={{marginTop:9}}>
          {[...log].reverse().map((x,j)=><div className="row" key={j} style={{padding:'4px 0',borderBottom:'1px solid var(--line)'}}>
            <span className="sr" style={{minWidth:76}}>{new Date(x.d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>
            <b style={{fontSize:13}}>{(x.set||1)} × {x.reps}{x.kg?' · '+String(x.kg).replace('.',',')+' kg':' · corpo libero'}</b>
            <div className="spacer"/>
            <button className="btn ghost small" onClick={()=>modifica(x)}>modifica</button>
            <button className="btn ghost small" onClick={()=>scrivi((st.carichi[id]||[]).filter(y=>y!==x))}>×</button>
          </div>)}
        </div>
      : <div className="note" style={{marginTop:9}}>Nessuna riga registrata per questo esercizio.</div>}
  </div>;
}

          const cambiaQ=(i,d)=>{const v=v0.voci.map((x,j)=>j===i?{...x,m:Math.max(0.5,Math.round(((x.m||1)+d)*2)/2)}:x);scrivi(v);};
          // con la ricerca cerco fra tutti gli alimenti, altrimenti mostro quelli tipici del pasto
          const lista=q ? ALIMENTI.filter(a=>a.n.toLowerCase().includes(q.toLowerCase()))
                        : ALIMENTI.filter(a=>a.cat.includes(CAT_PASTO[m.id])||a.cat.includes('x'));
          return <div className="meal" key={m.id}>
            <div className="mealhead">
              <span className="t">{m.n}</span>
              {stato(m)==='saltato'?<span className="m">saltato</span>
               :v.voci.length ? <span className="m">{v.k} kcal · {v.p}P {v.c}C {v.f}G</span>
                : (()=>{const a=adattato(m);return <span className="m">
                    {[a.palmi&&pl(a.palmi,'palmo','palmi'),a.pugni&&pl(a.pugni,'pugno','pugni'),a.pollici&&pl(a.pollici,'pollice','pollici')].filter(Boolean).join(' · ')||'niente'}
                    {res.k<=0?' · budget esaurito':''}</span>;})()}
              <button className="btn ghost small" onClick={()=>{setApri(aperto?null:m.id);setQ('');}}>{aperto?'Chiudi':'Segna'}</button>
              {stato(m)==='aperto'&&<button className="btn ghost small" onClick={()=>
                setReg(gAtt,{pasti:{...(reg.pasti||{}),[m.id]:{saltato:true,voci:[],k:0,p:0,c:0,f:0}}})}>Saltato</button>}
              {stato(m)==='saltato'&&<button className="btn ghost small" onClick={()=>{
                const pp={...(reg.pasti||{})};delete pp[m.id];setReg(gAtt,{pasti:pp});}}>Annulla</button>}
              {!v.voci.length&&stato(m)==='aperto'&&<button className="btn small" onClick={()=>{
                const a=adattato(m);
                const t=[{n:'Come proposto',k:0,p:Math.round(a.palmi*PORZ.palmo),c:Math.round(a.pugni*PORZ.pugno),f:Math.round(a.pollici*PORZ.pollice+a.palmi*4)}];
                t[0].k=Math.round(t[0].p*4+t[0].c*4+t[0].f*9); scrivi(t);}}>Come proposto</button>}
            </div>
            {(v.voci.length||aperto)&&<div className="mealbody">
              {v.voci.map((x,i)=>{const mm=x.m||1, o=ALIMENTI.find(z=>z.n===x.n);
                return <div className="opt" key={i}>
                <span>{x.n}<span className="note"> · {o?qtaTesto(o,mm):(x.u||'')}</span></span>
                <span className="q">
                  {Math.round(x.k*mm)} kcal
                  <button className="btn ghost small" style={{marginLeft:8,padding:'1px 7px'}} onClick={()=>cambiaQ(i,-0.5)}>−</button>
                  <button className="btn ghost small" style={{marginLeft:3,padding:'1px 7px'}} onClick={()=>cambiaQ(i,0.5)}>+</button>
                  <button className="btn ghost small" style={{marginLeft:3,padding:'1px 7px'}}
                    onClick={()=>scrivi(v.voci.filter((_,j)=>j!==i))}>×</button></span>
              </div>;})}
              {aperto&&<>
                <div className="hr" style={{margin:'12px 0'}}/>
                <input placeholder="Cerca fra tutti gli alimenti — salmone, speck, carote…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
                <div className="row" style={{gap:6}}>
                  {lista.slice(0,30).map(a=><span className="chip" key={a.i}
                    onClick={()=>{setQ('');scrivi([...v.voci,{n:a.n,m:1,k:a.k,p:a.p,c:a.c,f:a.f}]);}}>
                    + {a.n} <span className="note">{a.qb} {a.ub}</span></span>)}
                  {!lista.length&&<span className="note">Niente con questo nome. Usa le porzioni qui sotto.</span>}
                </div>
                <div className="hr" style={{margin:'12px 0'}}/>
                <div className="note" style={{marginBottom:7}}>Aggiungi quante voci vuoi, poi regola le quantità con − e +. Se non trovi l'alimento, usa le porzioni:</div>
                <div className="row" style={{gap:6}}>
                  {PORZ_RAPIDE.map((a,i)=><span className="chip" key={i}
                    onClick={()=>scrivi([...v.voci,{n:a.n,m:1,u:a.n,k:a.k,p:a.p,c:a.c,f:a.f}])}>+ {a.n}</span>)}
                </div>
              </>}
            </div>}
          </div>;
        })}
        <div className="hr"/>
        <div className="grid g4">
          <Kpi l={res.k>=0?(oggiQ?'Restano oggi':'Restano'):'Sei oltre di'} v={Math.abs(res.k)} u="kcal" cls="n"/>
          <Kpi l="Proteine" v={res.p>0?res.p:0} u="g da prendere" cls="p"/>
          <Kpi l="Carboidrati" v={res.c>0?res.c:0} u="g" cls="c"/>
          <Kpi l="Grassi" v={res.f>0?res.f:0} u="g" cls="f"/>
        </div>
        {cons.k>0&&<div style={{marginTop:12}} className={res.k<-250?'warn':res.p<=15?'ok':'note'}>
          {res.k<-250
            ? 'Oggi sei sopra il target di '+Math.abs(res.k)+' kcal. Non recuperare domani tutto insieme: la correzione si spalma sui giorni che restano, al massimo 150 kcal al giorno.'
            : res.p>40 ? 'Ti mancano ancora '+res.p+' g di proteine: è la parte da coprire per prima, il resto viene dopo.'
            : res.p<=15 ? 'Proteine coperte. Se resta spazio calorico prendilo da carboidrati e verdura.'
            : 'Sei in linea. Restano '+res.p+' g di proteine.'}
        </div>}
      </div>
    </>;
  })()}

  {/* ---------------- SETTIMANA ---------------- */}
  {tab==='settimana'&&(()=>{
    const maxK=Math.max(...giorni.map(g=>g.target));
    const tot=giorni.reduce((s,g)=>s+g.target,0), totT=giorni.reduce((s,g)=>s+g.tdee,0);
    return<>
      <div className="card">
        <div className="row"><div><h2>Bilancio della settimana</h2>
          <div className="sub" style={{marginBottom:0}}>Dal {new Date(ancora).toLocaleDateString('it-IT',{day:'numeric',month:'long'})}. Ogni colonna è il budget del giorno diviso nei tre macro.</div></div>
          <div className="spacer"/>
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()-7);setAncora(d);}}>←</button>
          <button className="btn ghost small" onClick={()=>setAncora(lunediDi(new Date()))}>Questa settimana</button>
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()+7);setAncora(d);}}>→</button>
        </div>
        <div className="hr"/>
        <div className="ledger">{giorni.map((g,i)=>{
          const h=g.target/maxK*100;
          return<div key={i} className={'ldcol'+(sel===g.data?' sel':'')+(g.data===oggi?' oggi':'')} onClick={()=>{setSel(g.data);setTab('pasti');}}>
            <div className="ldbar" style={{height:h+'%'}}>
              <div className="seg-f" style={{height:(g.gras*9/g.target*100)+'%'}}/>
              <div className="seg-c" style={{height:(g.carb*4/g.target*100)+'%'}}/>
              <div className="seg-p" style={{height:(g.prot*4/g.target*100)+'%'}}/>
            </div>
            <div className="ldfoot"><div className="ldday">{G3[i]}</div><div className="ldkcal">{g.target}</div>
              {consumato(st,g.data).k>0&&<div className={'ldkcal '+(consumato(st,g.data).k>g.target?'neg':'pos')}>{consumato(st,g.data).k}</div>}
              <div className="ldact">{g.etichetta||'riposo'}</div></div>
          </div>;})}
        </div>
        <div className="legend"><span><i className="dot seg-p"/>Proteine</span><span><i className="dot seg-c"/>Carboidrati</span>
          <span><i className="dot seg-f"/>Grassi</span><span style={{marginLeft:'auto'}}>Metabolismo basale {bmr(st.profilo)} kcal</span></div>
      </div>
      <div className="card">
        <div className="grid g4">
          <Kpi l="Totale settimana" v={tot.toLocaleString('it-IT')} u="kcal"/>
          <Kpi l="Fabbisogno" v={totT.toLocaleString('it-IT')} u="kcal"/>
          <Kpi l="Deficit" v={(tot-totT).toLocaleString('it-IT')} u="kcal" cls="p"/>
          <Kpi l="Variazione attesa" v={((tot-totT)/7700).toFixed(2)} u="kg" cls="f"/>
        </div>
        <div className="hr"/>
        <table><thead><tr><th>Giorno</th><th>Attività</th><th className="n">Target</th><th className="n">Pro</th><th className="n">Carb</th><th className="n">Gras</th><th className="n">Mangiato</th><th className="n">Scarto</th></tr></thead>
        <tbody>{giorni.map((g,i)=>{const c=consumato(st,g.data);const sc=c.k?c.k-g.target:null;
          return <tr key={i} style={g.data===oggi?{background:'#FBF3E2'}:{}}>
          <td><b>{G3[i]}</b> <span className="note">{g.data.slice(8)}/{g.data.slice(5,7)}</span></td>
          <td className="note">{g.etichetta||'riposo'}</td><td className="n"><b>{g.target}</b></td>
          <td className="n">{g.prot}</td><td className="n">{g.carb}</td><td className="n">{g.gras}</td>
          <td className="n">{c.k||'—'}</td>
          <td className={'n '+(sc===null?'':sc>0?'neg':'pos')}>{sc===null?'—':(sc>0?'+':'')+sc}</td></tr>;})}</tbody></table>
        {comp.passati>0&&<div className={Math.abs(comp.scost)<300?'ok':'warn'} style={{marginTop:14}}>
          Su {comp.passati} {comp.passati===1?'giorno registrato':'giorni registrati'} lo scarto è di <b className="mono">{comp.scost>0?'+':''}{comp.scost} kcal</b>.
          {comp.perGiorno===0?' Niente da correggere.':
            ' Il target dei giorni che restano è stato '+(comp.perGiorno<0?'abbassato':'alzato')+' di '+Math.abs(comp.perGiorno)+' kcal al giorno.'}
          {comp.troncato&&' La correzione è limitata a 150 kcal: il resto non si recupera e la settimana si chiude così.'}
        </div>}
        <div className="note" style={{marginTop:12}}>Le proteine restano fisse tutti i giorni: sono la variabile che protegge la massa mentre il peso scende. A muoversi sono solo i carboidrati, che si concentrano nei giorni in cui giochi.</div>
      </div>
    </>;
  })()}

  {/* ---------------- PASTI ---------------- */}
  {tab==='pasti'&&(()=>{
    const g=gSel, P=porzioni(g), oggiQuesto=g.data===oggi;
    const A=statoGiornata(st,g,oggiQuesto?comp.perGiorno:0);
    const vivo=oggiQuesto&&A.iniziata;   // giornata già cominciata: mostro cosa resta, non il piano teorico
    const pasti=A.pasti;
    const usi=usiProteine(st,g.data);    // quante volte hai già mangiato ogni fonte nei sette giorni prima di oggi
    const CARB_FAM=FAM_CARB.map(x=>x[1]);
    const usateP=Object.keys(usi).filter(f=>!CARB_FAM.includes(f)).sort((a,b)=>usi[b]-usi[a]);
    const usateC=Object.keys(usi).filter(f=>CARB_FAM.includes(f)).sort((a,b)=>usi[b]-usi[a]);
    return<>
      <div className="card">
        <div className="row"><div><h2>Pasti — {GIORNI[(new Date(g.data+'T12:00:00').getDay()+6)%7]}</h2>
          <div className="sub" style={{marginBottom:0}}>{g.etichetta||'Giorno di riposo'} · {g.target} kcal · {g.prot}P {g.carb}C {g.gras}G</div></div>
          <div className="spacer"/>
          <button className={'btn small '+(st.grammi?'on':'ghost')} onClick={()=>up({grammi:!st.grammi})}>{st.grammi?'Grammi visibili':'Mostra i grammi'}</button>
        </div>
        <div className="hr"/>
        <div className="row">
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()-7);setAncora(d);setSel(iso(d));}}>←</button>
          {giorni.map((x,i)=><span key={i} className={'chip'+(sel===x.data?' on':'')} onClick={()=>setSel(x.data)}>{G3[i]}<span className="note" style={{marginLeft:4}}>{x.data.slice(8)}</span></span>)}
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()+7);setAncora(d);setSel(iso(d));}}>→</button>
          {sel!==oggi&&<button className="btn ghost small" onClick={()=>{setAncora(lunediDi(new Date()));setSel(oggi);}}>Oggi</button>}
        </div>
        {vivo?<>
          <div className="ok" style={{marginTop:14}}>Giornata già cominciata: qui sotto trovi <b>quello che ti resta</b>, non il piano teorico. Hai preso {A.cons.k} kcal e {A.cons.p} g di proteine.</div>
          <div className="porz" style={{marginTop:12}}>
            <span className="pz"><b>{Math.max(0,A.res.k)}</b> kcal ancora disponibili</span>
            <span className="pz"><b>{Math.max(0,A.res.p)}</b> g di proteine da coprire</span>
            <span className="pz"><b>{Math.max(0,A.res.c)}</b> g di carboidrati</span>
            <span className="pz"><b>{Math.max(0,A.res.f)}</b> g di grassi</span>
          </div>
        </>:<>
          <div className="porz" style={{marginTop:14}}>
            <span className="pz"><b>{P.palmi}</b> palmi di proteine</span>
            <span className="pz"><b>{P.pugni}</b> pugni di carboidrati</span>
            <span className="pz"><b>{P.frutti}</b> porzioni di frutta</span>
            <span className="pz"><b>{P.pollici}</b> pollici di grassi</span>
            <span className="pz">verdura a volontà</span>
          </div>
          <div className="note">Il palmo è la mano senza le dita, spessore incluso. Il pugno è chiuso. Il pollice è tutto il dito. Sono misure tue, quindi si scalano da sole.</div>
        </>}
        {(usateP.length>0||usateC.length>0)&&<div className="note" style={{marginTop:10}}>
          {usateP.length>0&&<>Proteine degli ultimi sette giorni: {usateP.map(f=>f+' ×'+usi[f]).join(' · ')}.<br/></>}
          {usateC.length>0&&<>Carboidrati: {usateC.map(f=>f+' ×'+usi[f]).join(' · ')}.<br/></>}
          Le proposte qui sotto partono da quelli che hai usato meno.
        </div>}
      </div>

      {pasti.map(m=>{
       const sm=vivo?A.stato(m):'aperto', a=vivo?A.adattato(m):null;
       return <div className="meal" key={m.id} style={sm!=='aperto'?{opacity:.55}:{}}>
        <div className="mealhead">
          <span className="t">{m.n}</span>
          {sm==='fatto'&&<span className="tag b">già fatto</span>}
          {sm==='saltato'&&<span className="tag b">saltato</span>}
          {sm==='aperto'&&m.pre&&<span className="tag">due ore prima</span>}
          {sm==='aperto'&&m.post&&<span className="tag b">dopo il campo</span>}
          <span className="m">{sm!=='aperto'?'—'
            :a?((x=>x?x+' in tutto':'niente, il budget è finito')([a.palmi&&pl(a.palmi,'palmo','palmi'),a.pugni&&pl(a.pugni,'pugno','pugni'),a.pollici&&pl(a.pollici,'pollice','pollici')].filter(Boolean).join(' · ')))
            :[m.palmi&&pl(m.palmi,'palmo','palmi'),m.pugni&&pl(m.pugni,'pugno','pugni'),m.frutti&&m.frutti+' frutta',m.pollici&&pl(m.pollici,'pollice','pollici')].filter(Boolean).join(' · ')}</span>
        </div>
        {sm==='aperto'&&<div className="mealbody">
          {(()=>{
            const q={p:a?a.palmi:m.palmi, c:a?a.pugni:m.pugni, g:a?a.pollici:m.pollici, v:m.liste.some(l=>l[1]==='verdura')?1:0};
            const voci=[];
            m.liste.forEach(([,key])=>{
              ['p','c','g','v'].forEach(r=>{
                if(q[r]<=0||voci.some(x=>x.r===r)) return;
                // per le proteine parto dalla fonte che hai usato meno in settimana, non sempre dalla prima della lista
                const ordP=(r==='p'||r==='c')?ordinaPer(SCAMBI[key],r,usi):null;
                const o=ordP?ordP[0]:SCAMBI[key].find(x=>x.r===r);
                if(!o) return;
                if(r==='p'&&q[r]>=3){
                  // due palmi o più: spezzo su due famiglie diverse invece di chiederti sei uova
                  const alt=ordP.find(x=>famDi(x.n)!==famDi(o.n))||ordP[1];   // due palmi: due fonti diverse
                  const quota=Math.max(1,Math.round(q[r]/2));
                  voci.push({r,o,n:q[r]-quota,testo:quanti(o,q[r]-quota)});
                  if(alt) voci.push({r:'p2',o:alt,n:quota,testo:quanti(alt,quota)});
                } else voci.push({r,o,n:q[r],testo:quanti(o,q[r])});
              });
            });
            if(!a&&m.frutti>0) voci.push({r:'fr',n:m.frutti,testo:(m.frutti*150)+' g di frutta'});
            if(!voci.length) return <div className="note">Con quello che hai già mangiato non resta budget per questo pasto. Se hai fame, verdura libera.</div>;
            return <>
              <h3 style={{fontSize:13,marginBottom:6}}>Il piatto</h3>
              {a&&<div className="note" style={{marginBottom:6}}>Ricalcolato su quello che ti resta oggi, non sul programma teorico: è questo il numero da seguire.</div>}
              <div style={{border:'1px solid var(--line)',borderRadius:4,padding:'10px 12px',marginBottom:12,background:'#FBFCFA'}}>
                {voci.map((v,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',gap:10,padding:'3px 0'}}>
                  <span><b>{v.testo}</b></span>
                  <span className="note mono" style={{whiteSpace:'nowrap'}}>{v.r==='v'?'libera':pl(v.n,RUOLO[v.r][0],RUOLO[v.r][1])}</span>
                </div>)}
              </div>
              <h3 style={{fontSize:13,marginBottom:6}}>Se vuoi cambiare</h3>
              <div className="note" style={{marginBottom:8}}>Sostituisci una voce con un'altra dello stesso gruppo, alla quantità indicata per il tuo numero di porzioni. Le fonti proteiche sono ordinate dalla meno usata alla più usata negli ultimi sette giorni.</div>
              {m.liste.map(([tit,key])=>{
                const r=(SCAMBI[key][0]||{}).r, n=q[r]||0;
                if(n<=0) return null;
                const opz=(r==='p'||r==='c')?ordinaPer(SCAMBI[key],r,usi):SCAMBI[key].filter(o=>o.r===r);
                return <div key={key} style={{marginBottom:10}}>
                  <div className="note" style={{marginBottom:3}}>{tit} — {pl(n,RUOLO[r][0],RUOLO[r][1])}</div>
                  {opz.map((o,i)=>{const u=(r==='p'||r==='c')?(usi[famRuolo(o.n,r)]||0):0;
                    return <div className="opt" key={i}>
                    <span>{quanti(o,n)}</span>
                    <span className="q">{u>=2?'già '+u+' volte in settimana':(o.nota||(st.grammi?'1 porzione = '+o.q+' '+(o.q===1?o.u:(o.u2||o.u)):''))}</span>
                  </div>;})}
                </div>;
              })}
            </>;
          })()}
          {m.nota&&<div className="note" style={{marginTop:10}}>{m.nota}</div>}
          {a&&a.palmiTeorici>a.palmi&&<div className="warn" style={{marginTop:10}}>
            Il conto chiederebbe {pl(a.palmiTeorici,'palmo','palmi')}: qui ne trovi {a.palmi}, che è già il massimo sensato per un pasto solo.
            I {(a.palmiTeorici-a.palmi)*PORZ.palmo} g di proteine che restano fuori non si recuperano oggi, e va bene così — succede quando salti dei pasti e tutto il fabbisogno si schiaccia sulla cena. Conta la media della settimana.</div>}
        </div>}
      </div>;})}
    </>;
  })()}



  {/* ---------------- SPESA ---------------- */}
  {tab==='spesa'&&(()=>{
    // sommo le porzioni della settimana e le traduco in prodotti, con una ripartizione ragionevole
    const tot=giorni.reduce((a,g)=>{const P=porzioni(g);
      return {palmi:a.palmi+P.palmi,pugni:a.pugni+P.pugni,pollici:a.pollici+P.pollici,frutti:a.frutti+P.frutti};},
      {palmi:0,pugni:0,pollici:0,frutti:0});
    const su=(v,step)=>Math.ceil(v/step)*step;
    const gruppi=[
      ['Proteine',[
        ['Petto di pollo o tacchino', su(tot.palmi*0.30*120,100)+' g'],
        ['Manzo o lonza di maiale',   su(tot.palmi*0.20*120,100)+' g'],
        ['Uova',                      Math.ceil(tot.palmi*0.15*3)+' uova'],
        ['Salmone',                   su(tot.palmi*0.10*110,100)+' g'],
        ['Tonno al naturale',         Math.ceil(tot.palmi*0.10*2)+' scatolette'],
        ['Grana o formaggio',         su(tot.palmi*0.08*60,50)+' g'],
        ['Fiocchi di latte o ricotta',su(tot.palmi*0.07*150,100)+' g'],
      ]],
      ['Carboidrati',[
        ['Pane',            su(tot.pugni*0.30*60,100)+' g'],
        ['Pasta o riso',    su(tot.pugni*0.22*45,100)+' g'],
        ['Patate',          su(tot.pugni*0.13*170,500)+' g'],
        ['Crackers o gallette', su(tot.pugni*0.15*40,100)+' g'],
        ['Biscotti secchi', su(tot.pugni*0.20*40,100)+' g'],
      ]],
      ['Frutta e verdura',[
        ['Frutta',  su(tot.frutti*150,500)+' g'],
        ['Verdura', su(14*200,500)+' g'],
      ]],
      ['Grassi e dispensa',[
        ['Olio EVO',            su(tot.pollici*0.60*10,100)+' ml'],
        ['Mandorle o noci',     su(tot.pollici*0.25*12,50)+' g'],
        ['Cioccolato fondente', su(tot.pollici*0.15*20,50)+' g'],
        ['Latte',               su(7*400,500)+' ml'],
      ]],
      ['Scorta per l\'ufficio',[
        ['Tonno al naturale',   '4 scatolette'],
        ['Crackers o gallette', '1 confezione'],
        ['Mandorle',            '200 g'],
        ['Frutta da portare',   '4 pezzi'],
      ]],
    ];
    return<>
      <div className="card">
        <div className="row"><div><h2>Lista della spesa</h2>
          <div className="sub" style={{marginBottom:0}}>Settimana dal {new Date(ancora).toLocaleDateString('it-IT',{day:'numeric',month:'long'})}. Quantità a crudo, arrotondate per eccesso.</div></div>
          <div className="spacer"/>
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()-7);setAncora(d);}}>←</button>
          <button className="btn ghost small" onClick={()=>setAncora(lunediDi(new Date()))}>Questa settimana</button>
          <button className="btn ghost small" onClick={()=>{const d=new Date(ancora);d.setDate(d.getDate()+7);setAncora(d);}}>→</button>
        </div>
        <div className="hr"/>
        <div className="grid g4">
          <Kpi l="Porzioni proteiche" v={tot.palmi} u="palmi" cls="p"/>
          <Kpi l="Porzioni di carboidrati" v={tot.pugni} u="pugni" cls="c"/>
          <Kpi l="Frutta" v={tot.frutti} u="porzioni"/>
          <Kpi l="Grassi da aggiungere" v={tot.pollici} u="pollici" cls="f"/>
        </div>
      </div>
      <div className="card">
        <div className="grid g2">
          {gruppi.map(([g,voci])=><div key={g}>
            <h3 style={{marginBottom:8}}>{g}</h3>
            <table><tbody>{voci.map(([n,q])=><tr key={n}><td>{n}</td><td className="n">{q}</td></tr>)}</tbody></table>
          </div>)}
        </div>
        <div className="hr"/>
        <div className="note">La ripartizione fra i vari alimenti è una proposta: quello che conta è il totale delle porzioni qui sopra. Se una settimana vuoi più carne e meno uova, scambia pure — le liste di scambio nella scheda Pasti dicono a quanto corrisponde ogni sostituzione. La scorta per l'ufficio serve per i giorni in cui il pranzo fuori va storto.</div>
      </div>
    </>;
  })()}

  {/* ---------------- CALENDARIO ---------------- */}
  {tab==='calendario'&&(()=>{
    const primo=new Date(mese), ultimo=new Date(mese.getFullYear(),mese.getMonth()+1,0);
    const offset=(primo.getDay()+6)%7;
    const celle=[];
    for(let i=0;i<offset;i++) celle.push(null);
    for(let d=1;d<=ultimo.getDate();d++) celle.push(new Date(mese.getFullYear(),mese.getMonth(),d));
    const gg=celle.map(d=>d?giornoCalc(st,iso(d)):null);
    // consuntivo del mese
    let previste=0,fatte=0,saltate=0,daConfermare=0,kcalTot=0;
    gg.forEach(g=>{if(!g)return; g.att.forEach(a=>{previste++;
      if(!a.fatto)saltate++; else if(a.confermato)fatte++; else if(g.data<oggi)daConfermare++;});
      kcalTot+=g.extra;});
    const gSelC=giornoCalc(st,sel);
    const attSel=attivitaDi(st,sel), regSel=st.registro[sel]||{};
    const scriviAtt=(nuove)=>up({override:{...st.override,[sel]:nuove}});
    const setCampo=(campo,i,v)=>{const o={...(regSel[campo]||{})};o[i]=v;setReg(sel,{[campo]:o});};
    return<>
      <div className="card">
        <div className="row">
          <div><h2>{primo.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h2>
            <div className="sub" style={{marginBottom:0}}>Clicca un giorno per pianificarlo o per segnare com'è andata.</div></div>
          <div className="spacer"/>
          <button className="btn ghost small" onClick={()=>setMese(new Date(mese.getFullYear(),mese.getMonth()-1,1))}>←</button>
          <button className="btn ghost small" onClick={()=>{const d=new Date();setMese(new Date(d.getFullYear(),d.getMonth(),1));}}>Questo mese</button>
          <button className="btn ghost small" onClick={()=>setMese(new Date(mese.getFullYear(),mese.getMonth()+1,1))}>→</button>
        </div>
        <div className="hr"/>
        <div className="cal">
          {G3.map(d=><div key={d} className="calh">{d}</div>)}
          {celle.map((d,i)=>{
            if(!d) return <div key={i}/>;
            const g=gg[i], data=iso(d), passato=data<oggi;
            return <div key={i} className={'calc'+(sel===data?' sel':'')+(data===oggi?' oggi':'')} onClick={()=>setSel(data)}>
              <div className="caln">{d.getDate()}</div>
              {g.att.map((a,j)=><div key={j} className="cala" style={{borderLeftColor:COLORE(a.t),
                  opacity:!a.fatto?0.4:1, textDecoration:!a.fatto?'line-through':'none'}}>
                {ATT[a.t].n.replace('Allenamento futsal','Futsal').replace('Palestra ','Pal. ')}
                <span className="calm">{a.min}′{a.confermato?' ✓':passato?' ?':''}</span>
              </div>)}
              {!!g.extra&&<div className="calk">+{g.extra}</div>}
            </div>;
          })}
        </div>
        <div className="legend">
          <span><i className="dot" style={{background:'var(--mattone)'}}/>Futsal</span>
          <span><i className="dot" style={{background:'var(--oliva)'}}/>Palestra</span>
          <span><i className="dot" style={{background:'var(--senape)'}}/>Altro</span>
          <span style={{marginLeft:'auto'}}>✓ confermato · ? da segnare</span>
        </div>
      </div>

      <div className="card">
        <div className="grid g4">
          <Kpi l="Sedute in programma" v={previste} u="nel mese"/>
          <Kpi l="Confermate" v={fatte} u="" cls="f"/>
          <Kpi l="Saltate" v={saltate} u="" cls="p"/>
          <Kpi l="Da segnare" v={daConfermare} u="" cls="c"/>
        </div>
        {daConfermare>0&&<div className="note" style={{marginTop:12}}>Le sedute non segnate contano come fatte nel calcolo delle calorie. Se ne hai saltata qualcuna, marcala: il target di quei giorni si abbassa e il bilancio della settimana si corregge.</div>}
      </div>

      <div className="card">
        <h3>{new Date(sel+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</h3>
        <div className="sub">{st.override[sel]?'Giornata personalizzata.':'Segue il programma della stagione.'} Fabbisogno {gSelC.tdee} kcal · target {gSelC.target} kcal</div>
        {attSel.length?attSel.map((a,i)=>{
          const eff=gSelC.att[i];
          return <div key={i} style={{borderTop:'1px solid var(--line)',padding:'12px 0'}}>
            <div className="actrow" style={{gridTemplateColumns:'1.5fr .7fr .9fr auto'}}>
              <select value={a.t} onChange={e=>{const n=structuredClone(attSel);n[i].t=e.target.value;n[i].min=ATT[e.target.value].def;scriviAtt(n);}}>
                {Object.entries(ATT).map(([k,v])=><option key={k} value={k}>{v.n}</option>)}
              </select>
              <input type="number" step="5" value={eff.min} onChange={e=>setCampo('minuti',i,+e.target.value)}/>
              <select value={a.q||'sera'} onChange={e=>{const n=structuredClone(attSel);n[i].q=e.target.value;scriviAtt(n);}}>
                <option value="mattina">Mattina</option><option value="pomeriggio">Pomeriggio</option><option value="sera">Sera</option>
              </select>
              <button className="btn ghost small" onClick={()=>{const n=structuredClone(attSel);n.splice(i,1);scriviAtt(n);}}>Togli</button>
            </div>
            <div className="row" style={{marginTop:8}}>
              <button className={'btn small '+(eff.confermato?'on':'ghost')} onClick={()=>setCampo('fatti',i,true)}>Fatto</button>
              <button className={'btn small '+(!eff.fatto?'on':'ghost')} onClick={()=>setCampo('fatti',i,false)}>Saltato</button>
              <button className="btn ghost small" onClick={()=>{const o={...(regSel.fatti||{})};delete o[i];setReg(sel,{fatti:o});}}>Da fare</button>
              {eff.fatto&&<select value={eff.inten} style={{maxWidth:210}} onChange={e=>setCampo('intens',i,e.target.value)}>
                {Object.entries(INTENS).map(([k,v])=><option key={k} value={k}>{v.n}</option>)}</select>}
              <div className="spacer"/>
              <span className="mono note">{eff.fatto?'+'+Math.round(kcalAtt(eff,st.profilo.peso)*INTENS[eff.inten].k)+' kcal':'non conteggiato'}</span>
            </div>
            {eff.min!==a.min&&<div className="note" style={{marginTop:6}}>Previsti {a.min} minuti, segnati {eff.min}.</div>}
          </div>;
        }):<div className="note">Giorno di riposo.</div>}
        <div className="hr"/>
        <div className="row">
          <select id="addcal" defaultValue="pesi_b" style={{maxWidth:230}}>
            {Object.entries(ATT).map(([k,v])=><option key={k} value={k}>{v.n}</option>)}</select>
          <button className="btn ghost small" onClick={()=>{const t=document.getElementById('addcal').value;
            scriviAtt([...attSel,{t,min:ATT[t].def,q:'sera'}]);}}>Aggiungi</button>
          <button className="btn ghost small" onClick={()=>scriviAtt([])}>Metti a riposo</button>
          <div className="spacer"/>
          {st.override[sel]&&<button className="btn ghost small" onClick={()=>{const o={...st.override};delete o[sel];up({override:o});
            const r={...st.registro};if(r[sel]){const c={...r[sel]};delete c.fatti;delete c.minuti;delete c.intens;r[sel]=c;up({registro:r});}}}>Torna al programma</button>}
        </div>
      </div>
    </>;
  })()}

  {/* ---------------- PALESTRA ---------------- */}
  {tab==='palestra'&&(()=>{
    const prossime=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return giornoCalc(st,iso(d));});
    const conflitti=[];
    prossime.forEach((g,i)=>{
      const gambe=g.att.some(a=>ATT[a.t].gambe&&a.t.startsWith('pesi'));
      if(!gambe) return;
      for(let j=Math.max(0,i-2);j<=Math.min(prossime.length-1,i+2);j++){
        if(j!==i&&prossime[j].att.some(a=>a.t==='futsal_part')&&Math.abs(j-i)<2)
          conflitti.push(g.data);
      }
    });
    return<>
      <div className="card">
        <h2>Palestra</h2>
        <div className="sub">Due o tre sedute a rotazione: se ne salti una, hai comunque allenato tutto. Serie da fermare quando ne avresti ancora due in canna; a 12 ripetizioni pulite su tutte le serie, la volta dopo aumenti il peso e riparti da 8.</div>
        {fase==='off'&&<div className="ok">Fuori stagione puoi fare le tre sedute complete, gambe incluse: non c'è il campo a togliere recupero. Dal 7 settembre si passa alla sola seduta B.</div>}
        {fase==='prep'&&<div className="warn">Fino al 1 ottobre fai solo la <b>seduta B</b>, due volte a settimana. Con tre allenamenti sul campo le gambe sono già oltre il limite: aggiungere squat e affondi ora significa arrivare a metà ottobre stanco invece che pronto.</div>}
        {!!conflitti.length&&<div className="alert" style={{marginTop:10}}>Hai gambe pesanti a meno di 48 ore da una partita. Sposta la seduta A al martedì: è l'unica finestra pulita della settimana.</div>}
        <div className="row" style={{gap:6,marginTop:12}}>
          {[['allenamenti','Allenamenti'],['schede','Schede'],['progressi','Progressi']].map(([k,n])=>
            <button key={k} className={'btn '+(vistaPal===k?'':'ghost')+' small'} onClick={()=>setVistaPal(k)}>{n}</button>)}
        </div>
      </div>
      {vistaPal==='schede'&&Object.entries(SCHEDE).map(([k,s])=><div className="card" key={k}>
        <div className="row"><h3 style={{marginBottom:0}}>{s.n}</h3><span className="tag">{s.tag}</span></div>
        <div className="hr" style={{margin:'12px 0'}}/>
        {s.ex.map((e,i)=>{
          const id=k+'-'+i;
          const log=[...(st.carichi[id]||[])].sort((a,b)=>a.d.localeCompare(b.d));
          const ult=log[log.length-1];
          const aperto=exApri===id;
          return<div className="ex" key={i}>
            <div className="nm">{e.n}<span className="sr">{e.s}</span>
              <div className="spacer"/>
              {ult&&<span className="sr">ultimo: {(ult.set||1)}×{ult.reps}{ult.kg?' · '+ult.kg+' kg':''}</span>}
              <button className="btn ghost small" onClick={()=>{
                if(aperto){setExApri(null);return;}
                setExApri(id); setExForm({d:oggi,set:'',kg:'',reps:'',mod:null});
              }}>{aperto?'Chiudi':'Segna'}</button>
            </div>
            <div className="de">{e.d}</div>
            {!aperto&&(st.noteEx||{})[id]&&<div className="sr" style={{marginTop:6,color:'var(--oliva)'}}>Nota: {st.noteEx[id]}</div>}
            {!aperto&&log.length>1&&<div className="sr" style={{marginTop:6}}>Progressione: {log.slice(-6).map(x=>x.kg+' kg×'+x.reps).join(' · ')}</div>}
            {aperto&&<PannelloEx id={id} st={st} up={up} oggi={oggi} form={exForm} setForm={setExForm}/>}
          </div>;
        })}
      </div>)}
      {vistaPal==='schede'&&(()=>{
        // esercizi che aggiungi tu: stessa struttura delle schede, così entrano nel report come gli altri
        const mie=st.mieiEx||[];
        return<div className="card">
          <div className="row"><h3 style={{marginBottom:0}}>I tuoi esercizi</h3><span className="tag">aggiunti da te</span></div>
          <div className="sub" style={{marginTop:8}}>Per le macchine che usi e che non sono in scheda. Compaiono nel report insieme agli altri.</div>
          {mie.map((e,i)=>{
            const id='mio-'+i;
            const log=[...(st.carichi[id]||[])].sort((a,b)=>a.d.localeCompare(b.d));
            const ult=log[log.length-1];
            return<div className="ex" key={i}>
              <div className="nm">{e.n}
                <div className="spacer"/>
                {ult&&<span className="sr">ultimo: {(ult.set||1)}×{ult.reps}{ult.kg?' · '+ult.kg+' kg':''}</span>}
                <button className="btn ghost small" onClick={()=>{
                  if(exApri===id){setExApri(null);return;}
                  setExApri(id); setExForm({d:oggi,set:'',kg:'',reps:'',mod:null});
                }}>{exApri===id?'Chiudi':'Segna'}</button>
                <button className="btn ghost small" onClick={()=>{
                  if(!confirm('Tolgo "'+e.n+'"? Sparisce anche lo storico dei carichi.')) return;
                  const c={...st.carichi}; delete c[id];
                  // rinumero le chiavi degli esercizi che vengono dopo, altrimenti si spostano sui carichi sbagliati
                  const resto=mie.filter((_,j)=>j!==i);
                  const nc={}; Object.keys(c).forEach(k=>{
                    const m=k.match(/^mio-(\d+)$/);
                    if(!m){nc[k]=c[k];return;}
                    const j=+m[1]; nc[j>i?('mio-'+(j-1)):k]=c[k];
                  });
                  up({mieiEx:resto,carichi:nc});
                  setExApri(null);
                }}>×</button>
              </div>
              {exApri===id&&<PannelloEx id={id} st={st} up={up} oggi={oggi} form={exForm} setForm={setExForm}/>}
              {exApri!==id&&(st.noteEx||{})[id]&&<div className="sr" style={{marginTop:6,color:'var(--oliva)'}}>Nota: {st.noteEx[id]}</div>}
            </div>;
          })}
          <div className="row" style={{gap:6,marginTop:12}}>
            <input placeholder="Nome dell'esercizio" value={nuovoEx} onChange={ev=>setNuovoEx(ev.target.value)}
              onKeyDown={ev=>{if(ev.key==='Enter'&&nuovoEx.trim()){up({mieiEx:[...mie,{n:nuovoEx.trim()}]});setNuovoEx('');}}}/>
            <button className="btn small" onClick={()=>{
              if(!nuovoEx.trim()) return;
              up({mieiEx:[...mie,{n:nuovoEx.trim()}]}); setNuovoEx('');
            }}>Aggiungi</button>
          </div>
        </div>;
      })()}
      {vistaPal==='allenamenti'&&(()=>{
        // gli allenamenti non sono un dato nuovo: sono le righe di carico raggruppate per data.
        // così tutto quello che hai già segnato compare qui senza doverlo rifare.
        const tuttiEx=[
          ...Object.entries(SCHEDE).flatMap(([k,sc])=>sc.ex.map((e,i)=>({id:k+'-'+i,n:e.n,g:sc.n}))),
          ...(st.mieiEx||[]).map((e,i)=>({id:'mio-'+i,n:e.n,g:'I tuoi esercizi'})),
        ];
        const nomeDi=id=>(tuttiEx.find(x=>x.id===id)||{}).n||null;

        const sess={};
        Object.keys(st.carichi||{}).forEach(id=>{
          if(!nomeDi(id)) return;
          (st.carichi[id]||[]).forEach((x,j)=>{
            (sess[x.d]=sess[x.d]||[]).push({...x,id,j,n:nomeDi(id)});
          });
        });
        const date=Object.keys(sess).sort().reverse();

        const aggiungi=data=>{
          const reps=parseInt(aggEx.reps,10), set=parseInt(aggEx.set,10);
          const kg=aggEx.kg===''?0:parseFloat(String(aggEx.kg).replace(',','.'));
          if(!aggEx.ex||isNaN(reps)||reps<=0||isNaN(kg)) return;
          const pre=st.carichi[aggEx.ex]||[];
          up({carichi:{...st.carichi,[aggEx.ex]:[...pre,{d:data,set:(isNaN(set)||set<=0)?1:set,kg,reps}]}});
          setAggEx({...aggEx,set:'',reps:'',kg:''});   // tengo l'esercizio: spesso segni più serie di fila
        };
        const elimina=v=>{
          const resto=(st.carichi[v.id]||[]).filter((_,k)=>k!==v.j);
          const c={...st.carichi}; if(resto.length) c[v.id]=resto; else delete c[v.id];
          up({carichi:c});
        };

        // filtro dell'export: da quale data in poi prendere gli allenamenti
        const daQuando=()=>{
          const d=new Date(oggi+'T12:00:00');
          if(periodo==='settimana') return iso(lunediDi(new Date()));
          if(periodo==='mese'){d.setDate(d.getDate()-30);return iso(d);}
          if(periodo==='trimestre'){d.setDate(d.getDate()-90);return iso(d);}
          return '0000-00-00';
        };
        const seleziona=periodo==='singolo'
          ? (sessApri?[sessApri]:[])
          : date.filter(d=>d>=daQuando());

        return<>
          <div className="card noprint">
            <div className="row"><h3 style={{marginBottom:0}}>Nuovo allenamento</h3></div>
            <div className="sub" style={{marginTop:8}}>Scegli la data, poi aggiungi gli esercizi uno alla volta. Compaiono subito nell'elenco qui sotto.</div>
            <div className="row" style={{gap:6,flexWrap:'wrap',marginTop:10}}>
              <input type="date" value={sessApri||oggi} onChange={e=>setSessApri(e.target.value)} style={{maxWidth:150}}/>
              <select value={aggEx.ex} onChange={e=>setAggEx({...aggEx,ex:e.target.value})} style={{maxWidth:260}}>
                <option value="">Scegli l'esercizio…</option>
                {['Palestra A','Palestra B','Palestra C','I tuoi esercizi'].map(gr=>{
                  const dentro=tuttiEx.filter(x=>x.g===gr);
                  return dentro.length?<optgroup key={gr} label={gr}>
                    {dentro.map(x=><option key={x.id} value={x.id}>{x.n}</option>)}
                  </optgroup>:null;
                })}
              </select>
              <input type="number" placeholder="serie" value={aggEx.set}
                onChange={e=>setAggEx({...aggEx,set:e.target.value})} style={{maxWidth:76}}/>
              <input type="number" placeholder="rip." value={aggEx.reps}
                onChange={e=>setAggEx({...aggEx,reps:e.target.value})}
                onKeyDown={e=>{if(e.key==='Enter')aggiungi(sessApri||oggi);}} style={{maxWidth:76}}/>
              <input type="number" step="0.5" placeholder="kg" value={aggEx.kg}
                onChange={e=>setAggEx({...aggEx,kg:e.target.value})} style={{maxWidth:96}}/>
              <button className="btn small" onClick={()=>aggiungi(sessApri||oggi)}>Aggiungi</button>
            </div>
            <div className="note" style={{marginTop:6}}>Il peso lascialo vuoto per gli esercizi a corpo libero. Dopo aver aggiunto, l'esercizio resta selezionato: per un'altra serie cambi solo i numeri.</div>
          </div>

          <div className="card noprint">
            <div className="row"><h3 style={{marginBottom:0}}>Esporta</h3></div>
            <div className="row" style={{gap:6,flexWrap:'wrap',marginTop:10}}>
              <select value={periodo} onChange={e=>setPeriodo(e.target.value)} style={{maxWidth:220}}>
                <option value="singolo">Solo l'allenamento aperto</option>
                <option value="settimana">Questa settimana</option>
                <option value="mese">Ultimi 30 giorni</option>
                <option value="trimestre">Ultimi 90 giorni</option>
                <option value="tutto">Tutto lo storico</option>
              </select>
              <button className="btn" disabled={pdfCorso||!seleziona.length}
                onClick={()=>scaricaPDF('.sessione','allenamenti-'+periodo)}>
                {pdfCorso?'Genero…':'Esporta PDF'}
              </button>
            </div>
            <div className="note" style={{marginTop:6}}>
              {periodo==='singolo'
                ? (sessApri&&sess[sessApri]?'Esporta il '+fmtD(sessApri)+'.':"Apri un allenamento dall'elenco per esportarlo da solo.")
                : seleziona.length+(seleziona.length===1?' allenamento nel periodo.':' allenamenti nel periodo.')}
            </div>
          </div>

          {date.length===0&&<div className="card"><div className="note">Nessun allenamento registrato. Aggiungi il primo esercizio qui sopra.</div></div>}

          {date.map(d=>{
            const righe=sess[d];
            const dentro=seleziona.includes(d);
            const aperto=sessApri===d;
            return<div className={'card'+(dentro?' sessione':'')} key={d}>
              <div className="row">
                <h3 style={{marginBottom:0}}>{fmtDG(d)}</h3>
                <span className="tag">{pl(righe.length,'esercizio','esercizi')}</span>
                <div className="spacer"/>
                <span className="sr">{righe.reduce((a,x)=>a+(x.set||1),0)} serie</span>
                <button className="btn ghost small noprint" onClick={()=>setSessApri(aperto?null:d)}>
                  {aperto?'Chiudi':'Apri'}
                </button>
              </div>
              {aperto
                ? <div style={{marginTop:10}}>
                    {righe.map((x,k)=><div className="row" key={k} style={{padding:'5px 0',borderBottom:'1px solid var(--line)'}}>
                      <span style={{fontSize:13}}>{x.n}</span>
                      <div className="spacer"/>
                      <b style={{fontSize:13}}>{(x.set||1)} × {x.reps}{x.kg?' · '+String(x.kg).replace('.',',')+' kg':''}</b>
                      <button className="btn ghost small noprint" onClick={()=>elimina(x)}>×</button>
                    </div>)}
                    <textarea placeholder="Come è andata la seduta" rows={2} style={{width:'100%',marginTop:9,resize:'vertical'}}
                      value={(st.noteSess||{})[d]||''}
                      onChange={e=>{const n={...(st.noteSess||{})};
                        if(e.target.value.trim()) n[d]=e.target.value; else delete n[d];
                        up({noteSess:n});}}/>
                  </div>
                : <>

  {tab==='guida'&&<>

      <div className="sub">In due righe, così tra un mese ti ricordi perché i numeri sono questi.</div>
      <h3>Le calorie si muovono, le proteine no</h3>
      <p className="note">Il fabbisogno di ogni giorno è il metabolismo basale per il fattore della giornata, più le calorie dell'attività di quel giorno. Sopra ci va un deficit graduato: profondo nei giorni di riposo (20%), leggero quando ti alleni (8-10%). Sulla settimana la media è intorno a -8%, cioè circa tre etti a settimana. Piccolo di proposito: è il ritmo che permette a forza e prestazione di salire mentre il peso scende.</p>
      <p className="note">Proteine fisse a {st.profilo.protKg} g/kg tutti i giorni, grassi mai sotto {st.profilo.grassiKg} g/kg. L'unica leva che si muove sono i carboidrati, che si concentrano nei giorni in cui giochi.</p>
      <h3 style={{marginTop:14}}>Il pranzo fuori</h3>
      <p className="note">È l'unico pasto che non controlli, quindi ha una regola sola: deve esserci sempre la parte proteica. I carboidrati li sposti dove vuoi senza problemi, le proteine no, perché venti grammi persi a pranzo a cena non li recuperi. Le insalatone senza carne sono la trappola classica: sembrano la scelta giusta e ti lasciano affamato alle quattro. Tieni una scorta in ufficio — crackers, tonno, mandorle, un frutto — per i giorni storti.</p>
      <h3 style={{marginTop:14}}>La colazione</h3>
      <p className="note">Resta latte o tè con i biscotti. L'unica aggiunta è la parte proteica, che costa due minuti: mezzo litro di latte al posto di un quarto, oppure due uova sode preparate prima. Se la mattina salta del tutto, spezza il pasto: biscotti al volo e la parte proteica alle nove e mezza in ufficio. Il totale della giornata è l'unica cosa che conta.</p>
      <h3 style={{marginTop:14}}>Perché le proposte cambiano</h3>
      <p className="note">Il piatto guarda cosa hai registrato negli ultimi sette giorni e parte dalla fonte proteica che hai usato meno. Non è una questione di salute: le proteine sono proteine, da qualunque parte arrivino. È che mangiare pollo sei sere di fila stanca, e quando stanca si molla. Per lo stesso motivo, quando un pasto chiede due palmi o più, la proposta li spezza su due fonti diverse invece di chiederti sei uova in un colpo solo.</p>
      <h3 style={{marginTop:14}}>Quando sfori</h3>
      <p className="note">Lo scostamento non si recupera il giorno dopo tutto insieme. Si spalma sui giorni che restano nella settimana, al massimo 150 kcal al giorno, e mai sotto il metabolismo basale. Se è troppo grande per stare in quei limiti, resta lì e la settimana si chiude così: un pranzo abbondante costa qualche giorno di ritardo, non merita di innescare un digiuno.</p>
      <h3 style={{marginTop:14}}>La palestra sotto il futsal</h3>
      <p className="note">Il campo è già un carico enorme per le gambe ad alta velocità. In palestra le gambe si allenano per la forza e per non farsi male, non per il volume. Il lavoro pesante di gambe sta ad almeno 48 ore dalla partita, quindi in campionato è il martedì. Stacco rumeno e nordic curl sono in due sedute su tre di proposito: sono la cosa con più evidenza per prevenire gli infortuni agli ischiocrurali, che è l'infortunio tipico di questo sport.</p>
      <div className="hr"/>
      <div className="note">Le stime valgono per una persona sana e si basano su formule di popolazione. Se hai condizioni cliniche o vuoi qualcosa cucito addosso, la persona giusta resta una dietista — e ora avresti dati concreti da portarle.</div>

  </>}

          <option value="1.2">Molto sedentaria</option><option value="1.25">Sedentaria con qualche camminata</option>
          <option value="1.35">Spesso in piedi</option><option value="1.5">Lavoro fisico</option></select></Campo>
        <Campo l="Proteine (g per kg)"><select value={st.profilo.protKg} onChange={e=>upProf('protKg',+e.target.value)}>
          <option value="1.6">1,6 — minimo utile</option><option value="1.8">1,8 — scelto</option><option value="2">2,0 — più rigido</option></select></Campo>
        <Campo l="Grassi minimi (g per kg)"><select value={st.profilo.grassiKg} onChange={e=>upProf('grassiKg',+e.target.value)}>
          <option value="0.7">0,7</option><option value="0.8">0,8 — scelto</option><option value="1">1,0</option></select></Campo>
      </div>
      <div className="hr"/>
      <div className="grid g3">
        <Kpi l="Metabolismo basale" v={bmr(st.profilo)} u="kcal"/>
        <Kpi l="Proteine al giorno" v={Math.round(st.profilo.peso*st.profilo.protKg)} u="g" cls="p"/>
        <Kpi l="Grassi minimi" v={Math.round(st.profilo.peso*st.profilo.grassiKg)} u="g" cls="f"/>
      </div>
    </div>
    <div className="card">
      <h3>Dati</h3>
      <div className="row">
        <button className="btn ghost small" onClick={()=>{const b=new Blob([JSON.stringify(st,null,2)],{type:'application/json'});
          const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='piano-'+oggi+'.json';a.click();}}>Esporta</button>
        <button className="btn ghost small" onClick={()=>{const i=document.createElement('input');i.type='file';i.accept='.json';
          i.onchange=ev=>{const r=new FileReader();r.onload=()=>{try{setSt({...DEFAULT,...JSON.parse(r.result)});}catch(e){alert('File non leggibile.');}};r.readAsText(ev.target.files[0]);};i.click();}}>Importa</button>
        <div className="spacer"/>
        <button className="btn ghost small" onClick={()=>{if(confirm('Azzero tutto?'))setSt(DEFAULT);}}>Azzera</button>
      </div>
      <div className="hr"/>
      <h3>Sincronizzazione</h3>
      <div className="note">{FIREBASE.projectId
        ? 'Attiva sul progetto '+FIREBASE.projectId+', documento piano/'+DOC_ID+'. I dati si allineano tra telefono e computer entro qualche secondo.'
        : 'Non attiva: i dati restano su questo browser. Per accenderla, apri il file e incolla la configurazione Firebase nel blocco in cima allo script. Finché projectId resta vuoto non cambia niente.'}</div>
      <div className="note" style={{marginTop:8}}>Esporta ogni tanto comunque: è la copia che non dipende da nessun servizio.</div>
    </div>
  </>}

  </div></main></>);
}
class Rete extends React.Component{
  constructor(p){super(p);this.state={e:null};}
  static getDerivedStateFromError(e){return {e};}
  render(){
    if(!this.state.e) return this.props.children;
    return <div className="wrap" style={{padding:'40px 18px'}}>
      <div className="card"><h2>Qualcosa si è inceppato</h2>
      <div className="sub">La pagina non è riuscita a disegnarsi. Quasi sempre dipende da dati salvati in un formato vecchio.</div>
      <pre className="mono" style={{fontSize:12,whiteSpace:'pre-wrap',background:'#F4F6F2',padding:12,borderRadius:4}}>{String(this.state.e&&this.state.e.message)}</pre>
      <button className="btn" onClick={()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();}}>Azzera i dati salvati e ricarica</button>
      </div></div>;
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<Rete><App/></Rete>);
</script>
</body>
</html>
